<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.Y.S.T.E.M // SECURE_GATE_V.2</title>
    <style>
        /*
         * =========================================
         * 🌌 ADVANCED CYBERPUNK / LUXURY TECH THEME
         * =========================================
         */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Prompt:wght@300;400;600&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-base: #03040b;
            --neon-cyan: #00f3ff;
            --neon-purple: #b900ff;
            --neon-red: #ff2a5f;
            --gold-luxury: #ffd700;
            --glass-bg: rgba(5, 7, 20, 0.6);
            --glass-border: rgba(0, 243, 255, 0.2);
            --text-main: #e0fbfc;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-base);
            font-family: 'Prompt', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* 🕸️ Network Canvas Background */
        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* 💠 Cyber Panel (Main Container) */
        .cyber-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 45px 40px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.05);
            width: 90%; max-width: 420px;
            text-align: center;
            position: absolute; z-index: 10;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Decorative Corners */
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
        }
        
        .cyber-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 40px; height: 2px; background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }
        .cyber-panel::after {
            content: ''; position: absolute; bottom: 0; right: 0; width: 40px; height: 2px; background: var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple);
        }

        #secure-gate { transform: scale(1); opacity: 1; }
        #secure-gate.hidden { transform: scale(0.9) translateY(-20px); opacity: 0; pointer-events: none; filter: blur(5px); }

        #contact-vectors { transform: scale(0.8); opacity: 0; pointer-events: none; display: none; }
        #contact-vectors.active { display: block; animation: cyberPopIn 0.6s forwards; pointer-events: all; }
        #contact-vectors.hidden { transform: scale(0.8); opacity: 0; pointer-events: none; filter: blur(5px); }

        #payment-gateway { transform: scale(0.8); opacity: 0; pointer-events: none; display: none; border: 1px solid rgba(255, 42, 95, 0.4); max-height: 90vh; overflow-y: auto; }
        #payment-gateway.active { display: block; animation: cyberPopIn 0.6s forwards; pointer-events: all; }

        @keyframes cyberPopIn { 
            0% { transform: scale(0.8) translateY(20px); opacity: 0; filter: blur(10px); } 
            100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); } 
        }

        /* 🔠 Typography */
        .header { margin-bottom: 30px; }
        .header h1 { 
            font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); 
            font-size: 24px; font-weight: 700; letter-spacing: 2px; margin: 0 0 10px 0; 
            text-shadow: 0 0 15px rgba(0,243,255,0.5); 
        }
        .header p { font-family: 'Share Tech Mono', monospace; color: #8892b0; font-size: 13px; margin: 0; text-transform: uppercase; }

        /* ⌨️ Inputs */
        .input-group { text-align: left; margin-bottom: 25px; position: relative; }
        .input-label { font-family: 'Share Tech Mono', monospace; display: block; margin-bottom: 8px; font-size: 12px; color: var(--neon-cyan); opacity: 0.8; }
        input:not([type="file"]) { 
            width: 100%; padding: 15px 15px 15px 40px; 
            background: rgba(0, 243, 255, 0.03); 
            border: 1px solid rgba(0, 243, 255, 0.2); 
            color: #fff; font-family: 'Share Tech Mono', monospace; font-size: 16px; 
            box-sizing: border-box; transition: all 0.3s; 
            border-left: 4px solid var(--neon-cyan);
        }
        input:not([type="file"]):focus { outline: none; background: rgba(0, 243, 255, 0.1); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) sepia(100%) saturate(500%) hue-rotate(130deg); cursor: pointer; }
        
        .input-icon { position: absolute; left: 15px; bottom: 15px; color: var(--neon-cyan); font-size: 16px; pointer-events: none; }

        /* 🔘 Buttons */
        .btn { 
            border: none; padding: 16px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1.5px;
            cursor: pointer; width: 100%; transition: all 0.3s ease; margin-bottom: 15px; box-sizing: border-box; 
            display: flex; align-items: center; justify-content: center; gap: 12px;
            position: relative; overflow: hidden; text-transform: uppercase;
        }
        .btn:active { transform: scale(0.96); }

        .btn-primary { 
            background: linear-gradient(90deg, var(--neon-purple) 0%, #d814ff 100%); 
            color: white; box-shadow: 0 0 20px rgba(185, 0, 255, 0.4); 
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .btn-primary:hover { box-shadow: 0 0 30px rgba(185, 0, 255, 0.7); background: linear-gradient(90deg, #d814ff 0%, var(--neon-purple) 100%); }

        /* 🔥 SUPER LUXURY IG BUTTON 🔥 */
        .btn-ig {
            background: #111;
            color: white;
            border-radius: 8px;
            z-index: 1;
        }
        .btn-ig::before {
            content: ''; position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888, #f09433);
            z-index: -1; background-size: 400%; animation: igGlow 5s linear infinite;
            border-radius: 10px;
        }
        @keyframes igGlow { 0% { background-position: 0 0; } 50% { background-position: 400% 0; } 100% { background-position: 0 0; } }
        .btn-ig:hover::before { filter: blur(8px); }

        .btn-fb {
            background: #000;
            color: #1877F2;
            border: 1px solid #1877F2;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(24, 119, 242, 0.2);
        }
        .btn-fb:hover { background: rgba(24, 119, 242, 0.1); box-shadow: 0 0 20px rgba(24, 119, 242, 0.4), inset 0 0 20px rgba(24, 119, 242, 0.4); }

        .btn-cancel { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #aaa; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        .btn-cancel:hover { background: rgba(255,255,255,0.05); color: white; border-color: white; }

        /* 💸 Payment Gateway (Red Theme) */
        .payment-header h1 { color: var(--neon-red); text-shadow: 0 0 15px rgba(255, 42, 95, 0.6); }
        .amount-display { font-family: 'Orbitron', sans-serif; font-size: 38px; font-weight: 900; color: var(--gold-luxury); text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); margin: 15px 0 25px; letter-spacing: 2px; }
        
        /* Scanner Effect over QR */
        .real-qr-container { 
            position: relative; background: rgba(0, 0, 0, 0.8); border: 2px solid var(--neon-red); 
            padding: 10px; margin: 0 auto 25px; display: inline-block; overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 42, 95, 0.2);
        }
        .real-qr-container img { width: 160px; height: auto; display: block; filter: contrast(1.2); }
        .scanner-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: var(--neon-red); box-shadow: 0 0 15px var(--neon-red), 0 0 30px var(--neon-red);
            animation: scan 2.5s ease-in-out infinite; opacity: 0.8;
        }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }

        /* File Upload */
        .btn-upload { 
            background: rgba(0, 243, 255, 0.05); border: 1px dashed var(--neon-cyan); 
            color: var(--neon-cyan); font-family: 'Share Tech Mono', monospace; 
            padding: 15px; cursor: pointer; display: block; transition: all 0.3s;
            text-transform: uppercase; font-size: 13px; letter-spacing: 1px;
        }
        .btn-upload:hover { background: rgba(0, 243, 255, 0.15); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
        #slip-filename { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #fff; margin-top: 10px; display: block; word-break: break-all; }

        .status-msg { font-family: 'Share Tech Mono', monospace; font-size: 12px; margin-top: 15px; display: none; color: var(--neon-red); text-shadow: 0 0 10px rgba(255,42,95,0.6); text-transform: uppercase; }
        .system-log { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #00f3ff; position: absolute; bottom: 20px; left: 20px; text-align: left; opacity: 0.5; pointer-events: none; }
        .verifying-text { color: var(--gold-luxury); font-family: 'Share Tech Mono', monospace; font-size: 13px; display: none; margin-top: 15px; animation: pulse 1s infinite; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        /* SVG Icons */
        svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

    <!-- 🕸️ Advanced Network Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- 🛡️ STAGE 1: Secure Gate -->
    <div class="cyber-panel" id="secure-gate">
        <div class="header">
            <h1>SYS//GATEWAY</h1>
            <p>Authentication Required</p>
        </div>
        <div class="input-group">
            <label class="input-label" for="hint-input">DECRYPTION_HINT</label>
            <span class="input-icon">_</span>
            <input type="text" id="hint-input" placeholder="Enter Hint Code" autocomplete="off">
        </div>
        <div class="input-group">
            <label class="input-label" for="password-input">TEMPORAL_CODE</label>
            <span class="input-icon">#</span>
            <input type="date" id="password-input" autocomplete="off">
        </div>
        <button class="btn btn-primary" onclick="executeAccessProtocol()">[ INITIALIZE_BYPASS ]</button>
        <p class="status-msg" id="login-error">> ERROR 401: CREDENTIALS_INVALID</p>
    </div>

    <!-- ✅ STAGE 2: Contact Vectors -->
    <div class="cyber-panel" id="contact-vectors">
        <div class="header">
            <h1 style="color: #00ff88; text-shadow: 0 0 15px rgba(0,255,136,0.5);">ACCESS_GRANTED</h1>
            <p>Welcome. Select Neural Pathway.</p>
        </div>
        
        <!-- 🔥 Facebook Button -->
        <button class="btn btn-fb" onclick="initiatePayment('fb')">
            <svg viewBox="0 0 320 512"><path d="M279.14 288l14.22-92.66h-88.91v-60.13c0-25.35 12.42-50.06 52.24-50.06h40.42V6.26S260.43 0 225.36 0c-73.22 0-121.08 44.38-121.08 124.72v70.62H22.89V288h81.39v224h100.17V288z"/></svg>
            FACEBOOK_LINK
        </button>

        <!-- 🔥 Super Luxury IG Button -->
        <button class="btn btn-ig" onclick="initiatePayment('ig')">
            <svg viewBox="0 0 448 512"><path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/></svg>
            INSTAGRAM_LINK
        </button>
    </div>

    <!-- 💸 STAGE 3: Payment Ransom -->
    <div class="cyber-panel" id="payment-gateway">
        <div class="header payment-header">
            <h1>FIREWALL_BLOCKED</h1>
            <p>Premium Access Required</p>
        </div>
        <div class="amount-display">99.00 THB</div>
        
        <div class="real-qr-container">
            <div class="scanner-line"></div>
            <img src="https://cdn.discordapp.com/attachments/1490354567169184017/1544250022324080702/IMG_1951.jpg?ex=6a97d268&is=6a9680e8&hm=97091d37243be7eb64e85ae9e7dbd18700d23b06bba16845da7c2aab823bf717&" alt="PromptPay QR Code">
        </div>

        <div class="upload-wrapper">
            <input type="file" id="slip-upload" accept="image/*" style="display: none;" onchange="handleFileUpload(this)">
            <label for="slip-upload" class="btn-upload">[ UPLOAD_TRANSACTION_DATA ]</label>
            <span id="slip-filename"></span>
        </div>

        <button class="btn btn-primary" style="background: linear-gradient(90deg, #ff2a5f, #b900ff); box-shadow: 0 0 20px rgba(255, 42, 95, 0.4);" id="btn-verify" onclick="verifyPayment()">[ VERIFY_FUNDS ]</button>
        <button class="btn btn-cancel" onclick="cancelPayment()">[ ABORT ]</button>
        
        <p class="status-msg" id="payment-error">> ERROR: MISSING_EVIDENCE_PAYLOAD</p>
        <p class="verifying-text" id="verify-loader">> ANALYZING_BLOCKCHAIN... PLEASE WAIT_</p>
    </div>

    <!-- Typing System Log -->
    <div class="system-log" id="sys-log">> SYSTEM_INIT...<br>> AWAITING_COMMAND...</div>

    <script>
        // ==========================================
        // 🔧 1. ตั้งค่ารหัสผ่านและลิ้งก์
        // ==========================================
        const CORRECT_HINT = "ไม่แดกชามะนาว";
        const CORRECT_DATE = "2003-12-24"; 

        const LINKS = {
            fb: "https://www.facebook.com/share/1Ei8GRPBro/?mibextid=wwXIfr",
            ig: "https://www.instagram.com/t.anno24?igsi=a2h5MjBrczh3Z25l&utm_source=qr"
        };

        // ==========================================
        // 🚨 2. ใส่ DISCORD WEBHOOK URL ตรงนี้เมื่อได้มา! 🚨
        // ==========================================
        const DISCORD_WEBHOOK_URL = "ใส่_WEBHOOK_URL_ของน้องตรงนี้"; 

        // ==========================================
        // ⚙️ SYSTEM LOGIC
        // ==========================================
        const elGate = document.getElementById('secure-gate');
        const elVectors = document.getElementById('contact-vectors');
        const elPayment = document.getElementById('payment-gateway');
        const elLog = document.getElementById('sys-log');
        let currentTarget = ''; 

        // Typing effect for logs
        function updateLog(cmd, status) {
            elLog.innerHTML = `> EXEC: ${cmd}<br>> STATUS: ${status}`;
        }

        function executeAccessProtocol() {
            let hint = document.getElementById('hint-input').value.trim();
            let date = document.getElementById('password-input').value;
            let errorMsg = document.getElementById('login-error');

            if (hint === CORRECT_HINT && date === CORRECT_DATE) {
                errorMsg.style.display = 'none';
                elGate.classList.add('hidden');
                setTimeout(() => { 
                    elGate.style.display = 'none'; 
                    elVectors.classList.add('active'); 
                    updateLog("auth_bypass", "success_code_200"); 
                }, 500);
            } else {
                errorMsg.style.display = 'block';
                elGate.style.transform = 'scale(0.95)';
                setTimeout(() => elGate.style.transform = 'scale(1)', 150);
                updateLog("auth_bypass", "failed_code_401");
            }
        }

        function initiatePayment(targetApp) {
            currentTarget = targetApp;
            elVectors.classList.remove('active'); elVectors.classList.add('hidden');
            setTimeout(() => { 
                elVectors.style.display = 'none'; 
                elPayment.classList.add('active'); 
                updateLog("firewall_triggered", "ransom_demanded"); 
            }, 500);
        }

        function handleFileUpload(input) {
            const fileNameDisplay = document.getElementById('slip-filename');
            const errorMsg = document.getElementById('payment-error');
            if (input.files && input.files.length > 0) {
                errorMsg.style.display = 'none';
                fileNameDisplay.style.color = "var(--neon-cyan)";
                fileNameDisplay.innerText = `> LOADED: ${input.files[0].name}`;
                updateLog("file_buffer", "data_ready");
            } else {
                fileNameDisplay.innerText = "";
            }
        }

        function verifyPayment() {
            const fileInput = document.getElementById('slip-upload');
            const errorMsg = document.getElementById('payment-error');
            const btnVerify = document.getElementById('btn-verify');
            const loader = document.getElementById('verify-loader');

            if (fileInput.files.length === 0) {
                errorMsg.style.display = 'block';
                elPayment.style.transform = 'scale(0.95)';
                setTimeout(() => elPayment.style.transform = 'scale(1)', 150);
                return; 
            }
            
            errorMsg.style.display = 'none';
            btnVerify.style.display = 'none';
            document.querySelector('.btn-cancel').style.display = 'none';
            document.querySelector('.upload-wrapper').style.display = 'none';
            loader.style.display = 'block';
            loader.innerText = "> UPLOADING_EVIDENCE... PLEASE WAIT_";

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("content", "🚨 **INCOMING TRANSMISSION!** พี่รหัสส่งหลักฐานการโอนเงิน (99 บาท) เข้าสู่ระบบแล้ว! 💸");

            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                body: formData
            })
            .then(() => {
                loader.innerText = "> FUNDS_VERIFIED // FIREWALL_DISABLED //";
                loader.style.color = "#00ff88";
                setTimeout(() => {
                    window.open(LINKS[currentTarget], '_blank');
                    resetToVectors();
                }, 1500);
            })
            .catch(() => {
                loader.innerText = "> OFFLINE_BYPASS_ACTIVATED //";
                loader.style.color = "#00ff88";
                setTimeout(() => { window.open(LINKS[currentTarget], '_blank'); resetToVectors(); }, 1500);
            });
        }

        function cancelPayment() {
            elPayment.classList.remove('active');
            document.getElementById('slip-upload').value = "";
            document.getElementById('slip-filename').innerText = "";
            document.getElementById('payment-error').style.display = 'none';
            setTimeout(() => {
                elPayment.style.display = 'none';
                elVectors.style.display = 'block';
                elVectors.classList.remove('hidden'); elVectors.classList.add('active');
            }, 500);
        }

        function resetToVectors() {
            document.getElementById('btn-verify').style.display = 'flex';
            document.querySelector('.btn-cancel').style.display = 'block';
            document.querySelector('.upload-wrapper').style.display = 'block';
            document.getElementById('slip-upload').value = "";
            document.getElementById('slip-filename').innerText = "";
            const loader = document.getElementById('verify-loader');
            loader.style.display = 'none';
            loader.style.color = "var(--gold-luxury)";
            cancelPayment();
        }

        // ==========================================
        // 🕸️ NETWORK PARTICLES BACKGROUND
        // ==========================================
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            createParticles(); 
        }
        window.addEventListener('resize', resizeCanvas);
        
        class Particle {
            constructor() { 
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height; 
                this.size = Math.random() * 1.5 + 0.5; 
                this.speedX = Math.random() * 0.4 - 0.2; 
                this.speedY = Math.random() * 0.4 - 0.2; 
            }
            update() { 
                this.x += this.speedX; this.y += this.speedY; 
                if (this.x > canvas.width) this.x = 0; if (this.x < 0) this.x = canvas.width; 
                if (this.y > canvas.height) this.y = 0; if (this.y < 0) this.y = canvas.height; 
            }
            draw() { 
                ctx.fillStyle = 'rgba(0, 243, 255, 0.5)'; 
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); 
            }
        }
        
        function createParticles() { 
            particles = []; 
            const count = (canvas.width * canvas.height) / 10000; 
            for (let i = 0; i < count; i++) particles.push(new Particle()); 
        }
        
        function animate() { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            
            // Draw lines between close particles
            for(let i=0; i<particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for(let j=i+1; j<particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 243, 255, ${0.15 - dist/800})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate); 
        }
        
        resizeCanvas(); 
        animate();
    </script>
</body>
</html>
